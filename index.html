<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0c10"><title>Hum Studio</title>
<meta name="description" content="Hum Studio — hum a note, keep it, pick a sound, add a beat, and export WAV or MIDI. Your phone is an instrument.">
<meta name="application-name" content="Hum Studio"><meta name="apple-mobile-web-app-title" content="Hum Studio"><meta name="mobile-web-app-capable" content="yes">
<meta property="og:title" content="Hum Studio"><meta property="og:description" content="Hum a melody, pick sounds, add a beat, export WAV/MIDI.">
<link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg" type="image/svg+xml">
</head><body>
<div id="app">
 <header class="top"><button id="play" class="big play" aria-label="Play">▶</button><button id="replay" class="big replay" aria-label="Replay from start"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 2.64-6.36"/><path d="M3 3v5h5"/></svg></button><h1>Hum Studio</h1><span class="sp"></span>
  <button id="beatbtn" class="chip">🥁 Beat</button>
  <div class="xwrap"><button id="export" class="chip" aria-label="Export">⬇ Export</button><div id="xmenu" class="xmenu" hidden><button id="xwav">🔊 WAV audio</button><button id="xmid">🎼 MIDI file</button></div></div>
 </header>
 <div id="beatpanel" class="beatpanel" hidden>
  <div id="beats" class="beats"></div>
  <div class="tempo"><div id="tempos" class="tempos"></div><input id="bpm" type="range" min="60" max="160" step="1" aria-label="Tempo"><span id="bpmv"></span></div>
 </div>
 <div class="deck">
  <div class="humcol">
   <div class="microw"><button id="hum" class="hum" aria-label="Hum"><span>🎤</span></button>
    <div id="pop" class="pop" hidden><div id="pnote" class="pnote">C</div><div id="pstaff" class="pstaff"></div></div></div>
   <div id="humlbl" class="humlbl">Tap to hum</div>
   <div class="yn"><button id="no" class="big no" aria-label="Discard">✖</button><button id="yes" class="big yes" aria-label="Keep">✔</button></div>
  </div>
  <div id="sounds" class="sounds"></div>
 </div>
 <div class="tools"><span id="hint" class="hint">✔ adds to the highlighted lane · tap a lane to switch</span><button id="del" class="chip del" aria-label="Delete note" hidden>🗑 Delete note</button><span id="clip" class="clipchip" hidden><span id="cliptxt"></span><button id="clipx">Cancel</button></span><button id="clear" class="clear" aria-label="Clear all">Clear all</button></div>
 <div class="song"><div id="labels" class="labels"></div><div id="lane" class="lane"><div id="blocks" class="blocks"></div></div><button id="addbar" class="chip addbar" aria-label="Add bar">＋<small>bar</small></button></div>
</div>
<div id="picker" class="picker"><div class="sheet"><div class="phead"><b id="ptitle">Pick a sound</b><button id="pclose" class="chip" aria-label="Close">✕</button></div>
 <div id="pinuse" class="pinuse"></div>
 <input id="search" type="search" placeholder="Search 128 sounds…"><div id="plist" class="plist"></div></div></div>
<div id="lpm" class="lpm" hidden></div>
<div id="toast" class="toast" hidden></div>
<div id="undo" class="undo" hidden><span>Song cleared</span><button id="undobtn">Undo</button></div>
<div id="confirm" class="confirm" hidden><div class="cbox"><p>Clear your whole song?</p><small>All notes, lanes, beat and tempo reset.</small><div class="crow"><button id="cno" class="chip">Cancel</button><button id="cyes" class="chip cyes">Clear</button></div></div></div>
<script type="module" src="/src/main.ts"></script>
</body></html>
